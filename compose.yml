# Define os serviços (containers) que farão parte da aplicação.
services:

  # ============================================================
  # SERVIÇO DO BANCO DE DADOS MYSQL
  # ============================================================

  # Nome do serviço MySQL.
  # Esse nome também será utilizado como hostname pelos outros
  # containers da mesma rede Docker.
  mysql:

    # Imagem Docker utilizada para criar o container.
    # Neste caso, utiliza o MySQL na versão 8.0.
    image: mysql:8.0

    # Define o nome do container.
    # O container poderá ser identificado pelo nome "mysql".
    container_name: mysql

    # Define o comportamento do container caso ele seja encerrado.
    # "unless-stopped" reinicia automaticamente o container,
    # exceto quando ele tiver sido parado manualmente.
    restart: unless-stopped

    # Variáveis de ambiente utilizadas durante a configuração
    # inicial do MySQL.
    environment:

      # Define a senha do usuário administrador "root".
      MYSQL_ROOT_PASSWORD: root

    # Mapeamento das portas entre o computador e o container.
    ports:

      # Porta 3306 do computador -> porta 3306 do container.
      #
      # A porta 3306 é a porta padrão utilizada pelo protocolo
      # MySQL.
      - "3306:3306"

    # Define os volumes utilizados pelo container.
    volumes:

      # Associa o volume Docker "mysql_data" ao diretório
      # /var/lib/mysql dentro do container.
      #
      # O diretório /var/lib/mysql é onde o MySQL armazena
      # seus arquivos de dados.
      #
      # Dessa forma, os dados não são perdidos quando o
      # container é removido ou recriado.
      - mysql_data:/var/lib/mysql

    # Define as redes às quais o container estará conectado.
    networks:

      # Conecta o MySQL à rede "rede_cliente".
      #
      # Outros containers conectados à mesma rede poderão
      # acessar o MySQL utilizando o hostname "mysql".
      - rede_cliente


  # ============================================================
  # SERVIÇO DO PHPMYADMIN
  # ============================================================

  # Define o serviço que será responsável por executar
  # o phpMyAdmin, uma interface Web utilizada para administrar
  # bancos de dados MySQL.
  #phpmyadmin:

    # Define uma dependência entre os serviços.
    #
    # O phpMyAdmin depende do serviço "mysql" e, portanto,
    # o container do MySQL será iniciado antes do phpMyAdmin.
    #
    # IMPORTANTE:
    # O "depends_on" controla a ordem de inicialização,
    # mas não garante que o MySQL já esteja pronto para
    # receber conexões.
    #depends_on:
    #  - mysql

    # Define a imagem Docker utilizada para criar o container.
    #
    # A imagem phpmyadmin/phpmyadmin contém o phpMyAdmin
    # e os componentes necessários para executá-lo.
    #image: phpmyadmin/phpmyadmin

    # Define o comportamento do container quando ele for
    # encerrado.
    #
    # "always" faz com que o Docker tente reiniciar
    # automaticamente o container.
    #restart: always

    # Conecta o phpMyAdmin à rede Docker utilizada pela aplicação
    # e pelo banco de dados.
    #
    # Dessa forma, o phpMyAdmin consegue acessar o MySQL
    # utilizando o nome do serviço "mysql".
    #networks:
    #  - rede_cliente

    # Mapeia uma porta do computador para a porta do phpMyAdmin
    # dentro do container.
    #
    # Porta 88 do computador -> porta 80 do container.
    #
    # A porta 80 é a porta HTTP utilizada pelo phpMyAdmin.
    #
    # Depois de iniciar os containers, o phpMyAdmin poderá
    # ser acessado através de:
    # http://localhost:88
    #ports:
    #  - "88:80"

    # Define as variáveis de ambiente utilizadas para configurar
    # o phpMyAdmin.
    #environment:

      # Define o servidor MySQL ao qual o phpMyAdmin deverá
      # se conectar.
      #
      # "mysql" corresponde ao nome do serviço MySQL definido
      # no docker-compose.yml.
      #
      # Como os dois containers estão na mesma rede Docker,
      # o phpMyAdmin consegue localizar o MySQL pelo nome
      # "mysql".
      #PMA_HOST: mysql

      # Define a senha do usuário root do MySQL.
      #
      # Essa senha deve ser igual à senha definida no serviço
      # MySQL através da variável MYSQL_ROOT_PASSWORD.
      #MYSQL_ROOT_PASSWORD: root
      
  # ============================================================
  # SERVIÇO DA APLICAÇÃO JAVA
  # ============================================================

  # Nome do serviço que executará a aplicação Java.
  app:

    # Imagem Docker utilizada para executar a aplicação.
    image: cadastrocliente_web5_docker
        
    # Define as configurações necessárias para construir a imagem
    # Docker da aplicação.
    build:

      # Define a pasta que será utilizada como contexto durante
      # a construção da imagem.
      #
      # O ponto "." representa a pasta atual, onde está localizado
      # o arquivo compose.yml.
      #
      # Arquivos existentes dentro dessa pasta poderão ser
      # utilizados pelo Dockerfile durante o processo de construção.
      context: .

      # Define o nome do arquivo Dockerfile que será utilizado
      # para construir a imagem da aplicação.
      #
      # Neste caso, será utilizado o arquivo "Dockerfile",
      # localizado na pasta definida pelo "context".
      dockerfile: Dockerfile

    # Nome do container que executará a aplicação.
    container_name: cadastrocliente_web5_docker

    # Reinicia automaticamente o container caso ele seja
    # encerrado inesperadamente.
    restart: unless-stopped
   
    # Mapeamento das portas entre o computador e o container.
    ports:

      # Porta 8080 do computador -> porta 8080 do Tomcat.
      #
      # Assim, a aplicação poderá ser acessada através de:
      # http://localhost:8080
      - "8080:8080"

    # Define dependências entre os serviços.
    depends_on:

      # Determina que o container MySQL deve ser iniciado
      # antes do container da aplicação.
      #
      # IMPORTANTE:
      # Isso não garante que o MySQL esteja totalmente pronto
      # para aceitar conexões. Apenas estabelece a ordem de
      # inicialização dos containers.
      - mysql

    # Conecta a aplicação à mesma rede utilizada pelo MySQL.
    #
    # Isso permite que a aplicação encontre o banco de dados
    # utilizando o hostname "mysql".
    networks:
      - rede_cliente


# ==============================================================
# VOLUMES
# ==============================================================

# Declara os volumes utilizados pelos serviços.
volumes:

  # Cria o volume persistente utilizado pelo MySQL.
  #
  # Os dados armazenados nesse volume permanecem disponíveis
  # mesmo que o container MySQL seja removido.
  mysql_data:


# ==============================================================
# REDES
# ==============================================================

# Declara as redes utilizadas pelos serviços.
networks:

  # Nome da rede Docker que será utilizada pela aplicação,
  # pelo phpMyAdmin e pelo banco de dados.
  rede_cliente:

    # Define o tipo de driver utilizado pela rede.
    #
    # O driver "bridge" cria uma rede virtual que permite
    # a comunicação entre os containers conectados a ela.
    driver: bridge